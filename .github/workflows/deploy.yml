name: Build and Deploy Microservices

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: poc-eks
  NAMESPACE: microservices
  FRONTEND_REPO: poc-frontend
  BACKEND_REPO: poc-backend

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$FRONTEND_REPO:$TAG" ./frontend
          docker push "$REGISTRY/$FRONTEND_REPO:$TAG"

      - name: Build and push backend
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$BACKEND_REPO:$TAG" ./backend
          docker push "$REGISTRY/$BACKEND_REPO:$TAG"

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Create/update RDS Kubernetes Secret
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rds-secret \
            -n "$NAMESPACE" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_PORT="$DB_PORT" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -



      - name: Update image tags in Kubernetes manifests
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          sed -i "s|image:.*poc-frontend:.*|image: $REGISTRY/$FRONTEND_REPO:$TAG|g" k8s/frontend-deployment.yaml
          sed -i "s|image:.*poc-backend:.*|image: $REGISTRY/$BACKEND_REPO:$TAG|g" k8s/backend-deployment.yaml

          echo "Updated frontend image:"
          grep "image:" k8s/frontend-deployment.yaml

          echo "Updated backend image:"
          grep "image:" k8s/backend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend-deployment.yaml k8s/backend-deployment.yaml

          git diff --cached --quiet || git commit -m "Update image tags to ${GITHUB_SHA}"

          git push
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            -n "$NAMESPACE" --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n "$NAMESPACE" --timeout=180s

      - name: Show deployment status
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get svc -n "$NAMESPACE"
